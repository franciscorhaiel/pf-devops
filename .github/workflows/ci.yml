name: CI - Build, Test y Seguridad

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write   # necesario para subir resultados SARIF

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/pf-cloud-api
  PYTHON_VERSION: "3.12"

jobs:
  # =========================================================================
  # 1. Lint y tests unitarios
  # =========================================================================
  test:
    name: Lint y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias
        run: pip install -r app/requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app

      - name: Tests unitarios
        run: pytest app/tests -v --junitxml=reporte-tests.xml

      - name: Publicar reporte de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-tests
          path: reporte-tests.xml

  # =========================================================================
  # 2. SAST - analisis estatico del codigo y de dependencias
  # =========================================================================
  sast:
    name: SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Bandit: vulnerabilidades en codigo Python
      - name: Bandit
        run: |
          pip install bandit[sarif]
          bandit -r app -x app/tests -f sarif -o bandit.sarif || true

      - name: Subir resultados de Bandit
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit.sarif
          category: bandit

      # Semgrep: reglas de seguridad multi-lenguaje
      - name: Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/security-audit p/secrets p/dockerfile

      # Gitleaks: detecta secretos commiteados
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Checkov: seguridad de la infraestructura como codigo
      - name: Checkov (Terraform y Kubernetes)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform,kubernetes,dockerfile
          soft_fail: true
          output_format: cli,sarif
          output_file_path: console,checkov.sarif

      - name: Subir resultados de Checkov
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov.sarif
          category: checkov

  # =========================================================================
  # 3. Build de la imagen y escaneo de vulnerabilidades
  # =========================================================================
  build:
    name: Build y push
    needs: [test, sast]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login al registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadatos de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}

      # La etapa "tester" del Dockerfile corre los tests dentro del build:
      # si fallan, no se construye el runtime.
      - name: Build de la etapa de test
        uses: docker/build-push-action@v6
        with:
          context: .
          target: tester
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build y push del runtime
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Medir tamano de la imagen (evidencia multi-stage)
        run: |
          docker build --target builder -t pf:builder . -q
          docker build --target runtime -t pf:runtime . -q
          echo "### Tamano de imagenes por etapa" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          docker images --format '{{.Repository}}:{{.Tag}}\t{{.Size}}' \
            | grep '^pf:' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # Trivy: CVEs en la imagen final
      - name: Trivy (escaneo de imagen)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: pf:runtime
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Subir resultados de Trivy
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy

  # =========================================================================
  # 4. DAST - analisis dinamico contra la app corriendo
  # =========================================================================
  dast:
    name: DAST (OWASP ZAP)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Levantar la app
        run: |
          docker build --target runtime -t pf:dast .
          docker run -d --name app -p 8000:8000 pf:dast
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/healthz && break
            sleep 2
          done

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.13.0
        with:
          target: http://localhost:8000
          rules_file_name: .zap/rules.tsv
          cmd_options: "-a -j"
          allow_issue_writing: false

      - name: Logs de la app
        if: always()
        run: docker logs app
