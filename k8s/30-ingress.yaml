apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pf-cloud-api
  namespace: pf-app
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    # Rate limiting: protege la app y evita escalado por trafico abusivo
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
spec:
  ingressClassName: nginx
  rules:
    - host: pf-cloud.local          # agregar a /etc/hosts como 127.0.0.1
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pf-cloud-api
                port:
                  name: http
