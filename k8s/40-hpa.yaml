apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pf-cloud-api
  namespace: pf-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pf-cloud-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30      # reacciona rapido a picos
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300     # baja despacio: evita flapping
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
