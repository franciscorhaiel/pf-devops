# Seguridad: solo el ingress-controller puede hablarle a los pods de la app.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pf-cloud-api
  namespace: pf-app
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pf-cloud-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8000
